services:
  - type: web
    name: gis-watermeter
    runtime: node
    plan: free
    region: singapore
    buildFilter:
      paths:
        - apps/backend/**
        - apps/backend/package.json
        - apps/backend/package-lock.json
        - render.yaml
    healthCheckPath: /health
    buildCommand: cd apps/backend && npm ci --include=dev && npm run build
    startCommand: cd apps/backend && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TELEGRAM_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
